<div class="rounded-2xl bg-slate-900/60 border border-slate-800 p-4">
  <div class="flex items-center justify-between">
    <p class="text-sm text-slate-400">Progress</p>
    <p class="text-lg font-semibold">{{ progress }}%</p>
  </div>
  <div class="mt-3 h-2 rounded-full bg-slate-800">
    <div class="h-2 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400" [style.width.%]="progress"></div>
  </div>
</div>
