<div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl hover:shadow-indigo-500/20 transition">
  <div class="flex items-center gap-4">
    <div class="h-14 w-14 rounded-full bg-slate-800 overflow-hidden">
      <img *ngIf="teacher.avatarUrl" [src]="teacher.avatarUrl" alt="Teacher" class="h-full w-full object-cover" />
    </div>
    <div>
      <p class="text-lg font-semibold">{{ teacher.isAi ? 'AI Mentor' : 'Coach' }} {{ teacher.userId }}</p>
      <p class="text-xs text-slate-400">{{ teacher.teachingStyle }}</p>
    </div>
  </div>
  <div class="mt-4 flex flex-wrap gap-2">
    <span *ngFor="let subject of teacher.subjects" class="text-xs px-2 py-1 rounded-full bg-slate-800">
      {{ subject }}
    </span>
  </div>
  <div class="mt-4 flex items-center justify-between text-sm text-slate-300">
    <div>
      <p class="text-slate-400">Rating</p>
      <app-rating-stars [rating]="teacher.rating"></app-rating-stars>
    </div>
    <div class="text-right">
      <p class="text-slate-400">Price/hour</p>
      <p class="text-lg font-semibold">€{{ teacher.pricePerHour }}</p>
    </div>
  </div>
  <div class="mt-4 text-xs text-slate-400">Availability: {{ teacher.availability.join(', ') }}</div>
</div>
