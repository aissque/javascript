<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm text-slate-400">Session</p>
      <p class="text-lg font-semibold">{{ session.mode | titlecase }} Room</p>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300">{{ session.durationMinutes }} min</span>
  </div>
  <p class="mt-3 text-sm text-slate-300">Scheduled: {{ session.scheduledAt | date:'medium' }}</p>
  <div class="mt-4 flex items-center justify-between text-xs text-slate-400">
    <span>Teacher: {{ session.teacherId }}</span>
    <span>{{ session.studentIds.length }} students</span>
  </div>
</div>
