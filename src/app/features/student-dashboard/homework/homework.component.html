<section class="mt-10">
  <h2 class="text-2xl font-semibold">Homework</h2>
  <div class="mt-6 grid gap-4">
    <div *ngFor="let task of tasks" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-sm font-semibold">{{ task.title }}</p>
      <p class="text-xs text-slate-400">Due: {{ task.due }}</p>
    </div>
  </div>
</section>
