<section class="mt-10">
  <h2 class="text-2xl font-semibold">My courses</h2>
  <div class="mt-6 grid gap-4 md:grid-cols-2">
    <div *ngFor="let course of courses" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-lg font-semibold">{{ course.title }}</p>
      <p class="text-sm text-slate-400">{{ course.description }}</p>
      <p class="text-xs text-slate-500 mt-3">Level: {{ course.level }} • {{ course.durationWeeks }} weeks</p>
    </div>
  </div>
</section>
