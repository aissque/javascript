<section class="mt-10">
  <h1 class="text-3xl font-semibold">Admin dashboard</h1>
  <p class="text-sm text-slate-400 mt-2">Monitor platform health, payments, and AI configurations.</p>
  <div class="mt-6 grid gap-4 md:grid-cols-3">
    <div *ngFor="let metric of metrics" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-xs text-slate-400">{{ metric.label }}</p>
      <p class="text-2xl font-semibold">{{ metric.value }}</p>
    </div>
  </div>
</section>
