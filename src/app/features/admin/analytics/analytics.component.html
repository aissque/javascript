<section class="mt-10">
  <h2 class="text-2xl font-semibold">Analytics</h2>
  <div class="mt-6 grid gap-4 md:grid-cols-3">
    <div *ngFor="let chart of charts" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-xs text-slate-400">{{ chart.label }}</p>
      <p class="text-2xl font-semibold">{{ chart.value }}</p>
    </div>
  </div>
</section>
