<section class="mt-10">
  <h2 class="text-2xl font-semibold">Payment management</h2>
  <div class="mt-6 grid gap-4 md:grid-cols-2">
    <div *ngFor="let payment of payments" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-sm font-semibold">€{{ payment.amount }} • {{ payment.status }}</p>
      <p class="text-xs text-slate-400">{{ payment.paidAt | date:'mediumDate' }}</p>
    </div>
  </div>
</section>
