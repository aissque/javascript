<section class="mt-10">
  <h2 class="text-2xl font-semibold">Teaching schedule</h2>
  <div class="mt-6 space-y-3">
    <div *ngFor="let slot of slots" class="p-4 rounded-2xl border border-slate-800 bg-slate-900/60 flex justify-between">
      <span class="text-sm">{{ slot.time }}</span>
      <span class="text-xs text-slate-400">{{ slot.topic }}</span>
    </div>
  </div>
</section>
