<section class="mt-10">
  <h2 class="text-2xl font-semibold">Student roster</h2>
  <div class="mt-6 grid gap-4 md:grid-cols-2">
    <div *ngFor="let student of students" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-sm font-semibold">Student {{ student.id }}</p>
      <p class="text-xs text-slate-400">Level: {{ student.level }}</p>
      <p class="text-xs text-slate-500 mt-2">Goals: {{ student.goals.join(', ') }}</p>
    </div>
  </div>
</section>
