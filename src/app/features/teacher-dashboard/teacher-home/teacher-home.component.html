<section class="mt-10">
  <h1 class="text-3xl font-semibold">Teacher dashboard</h1>
  <p class="text-sm text-slate-400 mt-2">Manage sessions and track student outcomes.</p>
  <div class="mt-6 grid gap-4 md:grid-cols-3">
    <div *ngFor="let stat of stats" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-xs text-slate-400">{{ stat.label }}</p>
      <p class="text-2xl font-semibold">{{ stat.value }}</p>
    </div>
  </div>
</section>
