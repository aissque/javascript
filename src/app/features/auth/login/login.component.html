<section class="max-w-xl mx-auto mt-12 bg-slate-900/70 border border-slate-800 rounded-3xl p-8">
  <h1 class="text-2xl font-semibold">Welcome back</h1>
  <p class="text-sm text-slate-400 mt-2">Log in to continue your AI-powered learning journey.</p>
  <div class="mt-6 space-y-4">
    <input [(ngModel)]="email" type="email" placeholder="Email" class="w-full rounded-xl bg-slate-800 px-4 py-3 text-sm" />
    <input [(ngModel)]="password" type="password" placeholder="Password" class="w-full rounded-xl bg-slate-800 px-4 py-3 text-sm" />
  </div>
  <p *ngIf="errorMessage" class="text-sm text-rose-400 mt-3">{{ errorMessage }}</p>
  <button (click)="submit()" class="mt-6 w-full rounded-xl bg-indigo-500 py-3 text-sm font-medium">Login</button>
  <p class="text-sm text-slate-400 mt-4">No account? <a routerLink="/register" class="text-indigo-300">Create one</a></p>
</section>
