<section class="max-w-xl mx-auto mt-12 bg-slate-900/70 border border-slate-800 rounded-3xl p-8">
  <h1 class="text-2xl font-semibold">Reset your password</h1>
  <p class="text-sm text-slate-400 mt-2">We will send you a secure reset link.</p>
  <div class="mt-6">
    <input [(ngModel)]="email" type="email" placeholder="Email" class="w-full rounded-xl bg-slate-800 px-4 py-3 text-sm" />
  </div>
  <button (click)="submit()" class="mt-6 w-full rounded-xl bg-indigo-500 py-3 text-sm font-medium">Send reset link</button>
  <p *ngIf="submitted" class="text-sm text-emerald-400 mt-4">Check your inbox for the reset link.</p>
</section>
