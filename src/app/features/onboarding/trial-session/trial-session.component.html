<section class="mt-10">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold">Start your free trial</h1>
      <p class="text-sm text-slate-400">Launch a live AI session and explore the platform.</p>
    </div>
    <div class="px-4 py-2 rounded-full bg-indigo-500/20 text-indigo-300 text-sm">Step 6/6</div>
  </div>
  <div class="mt-6 grid gap-4 md:grid-cols-3">
    <div *ngFor="let benefit of benefits" class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60">
      <p class="text-sm font-semibold">{{ benefit }}</p>
    </div>
  </div>
  <button class="mt-6 px-6 py-3 rounded-xl bg-indigo-500 text-sm font-medium">Launch trial session</button>
</section>
